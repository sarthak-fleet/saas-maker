<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio project strip review</title>
    <link rel="stylesheet" href="../../src/index.css" />
    <style>
      :root { color: #292524; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: #fafaf9; }
      main { display: grid; min-height: calc(100vh - 46px); place-items: center; padding: 2rem; }
      .host { width: min(44rem, 100%); }
      .host p { max-width: 56ch; color: #78716c; line-height: 1.65; }
      .baseline { min-height: 46px; border-block: 1px solid #e7e5e4; }
    </style>
  </head>
  <body>
    <main>
      <section class="host" aria-labelledby="review-title">
        <p>End of product content</p>
        <h1 id="review-title">Keep exploring the portfolio.</h1>
        <p>
          The shared rail should feel native to this quiet host surface while keeping every
          project link readable and controllable.
        </p>
      </section>
    </main>
    <div class="baseline" data-before></div>
    <aside class="portfolio-project-strip" aria-label="More from Sarthak" data-after>
      <div class="portfolio-project-strip__inner">
        <div class="portfolio-project-strip__meta">
          <span class="portfolio-project-strip__label">More from Sarthak</span>
          <button class="portfolio-project-strip__motion-control" type="button" aria-pressed="false">
            Pause
          </button>
        </div>
        <div class="portfolio-project-strip__viewport">
          <ul class="portfolio-project-strip__track" data-loop="true" data-paused="false" style="--portfolio-strip-speed: 42s">
            <li class="portfolio-project-strip__item"><a class="portfolio-project-strip__link" href="#codevetter">CodeVetter</a><span class="portfolio-project-strip__dot" aria-hidden="true">·</span></li>
            <li class="portfolio-project-strip__item"><a class="portfolio-project-strip__link" href="#pace">Pace</a><span class="portfolio-project-strip__dot" aria-hidden="true">·</span></li>
            <li class="portfolio-project-strip__item"><a class="portfolio-project-strip__link" href="#posttrain">PostTrainLLM</a><span class="portfolio-project-strip__dot" aria-hidden="true">·</span></li>
            <li class="portfolio-project-strip__item" aria-hidden="true"><a class="portfolio-project-strip__link" href="#codevetter-copy" tabindex="-1">CodeVetter</a><span class="portfolio-project-strip__dot" aria-hidden="true">·</span></li>
            <li class="portfolio-project-strip__item" aria-hidden="true"><a class="portfolio-project-strip__link" href="#pace-copy" tabindex="-1">Pace</a><span class="portfolio-project-strip__dot" aria-hidden="true">·</span></li>
            <li class="portfolio-project-strip__item" aria-hidden="true"><a class="portfolio-project-strip__link" href="#posttrain-copy" tabindex="-1">PostTrainLLM</a><span class="portfolio-project-strip__dot" aria-hidden="true">·</span></li>
          </ul>
        </div>
      </div>
    </aside>
    <script>
      const params = new URLSearchParams(location.search);
      const before = document.querySelector('[data-before]');
      const after = document.querySelector('[data-after]');
      if (params.has('before')) after.remove();
      else before.remove();
      if (params.get('theme') === 'dark' && after) {
        after.dataset.theme = 'dark';
        document.documentElement.style.color = '#f5f5f4';
        document.body.style.background = '#171717';
      }

      const control = document.querySelector('.portfolio-project-strip__motion-control');
      const track = document.querySelector('.portfolio-project-strip__track');
      control?.addEventListener('click', () => {
        const paused = track.dataset.paused !== 'true';
        track.dataset.paused = String(paused);
        control.setAttribute('aria-pressed', String(paused));
        control.textContent = paused ? 'Resume' : 'Pause';
      });
    </script>
  </body>
</html>
