name: Update Global DR History

on:
  workflow_call:
    secrets:
      AHREFS_API_KEY:
        required: false
        description: >
          Ahrefs free-account API key. Required by the domain-rating-free
          endpoint from 2026-08-10; the free public endpoint itself remains
          credential-free and unit-free before that date.
          https://docs.ahrefs.com/en/api/reference/public/get-domain-rating-free
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundry/helpers/drank
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Update global DR data
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: node scripts/update-global-dr.mjs

      - name: Update Fleet domain DR data
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: node scripts/update-global-dr.mjs --sites data/fleet-sites.json --data data/fleet-dr.json --label fleet

      - name: Publish changed history
        run: |
          cp data/global-dr.json data/fleet-dr.json public/data/
          git add data/global-dr.json data/fleet-dr.json public/data/global-dr.json public/data/fleet-dr.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dr): weekly update global DR history"
          git push
