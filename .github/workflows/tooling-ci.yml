name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate public manifest
        working-directory: tooling
        run: node scripts/audit.mjs --validate-only
      - name: Run tests
        working-directory: tooling
        run: node --test test/*.test.mjs
      - name: Validate scripts and skills
        working-directory: tooling
        run: node scripts/validate-tooling.mjs
