name: Ops Console CI

on:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/apps/dashboard/fleet-console/pnpm-lock.yaml
      - working-directory: foundry/apps/dashboard/fleet-console
        run: pnpm install --frozen-lockfile
      - working-directory: foundry/apps/dashboard/fleet-console
        run: pnpm run build
