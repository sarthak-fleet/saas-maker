name: Public Performance Sweep

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: Repeated requests per site
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run bounded public performance sweep
        id: audit
        continue-on-error: true
        env:
          AUDIT_RUNS: ${{ inputs.runs || '3' }}
        run: node scripts/audit.mjs --mode performance --runs "$AUDIT_RUNS"
      - name: Commit sanitized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/performance
          if git diff --cached --quiet; then
            echo "No report change"
          else
            git commit -m "evidence: update public performance sweep"
            git push
          fi
      - name: Preserve audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
