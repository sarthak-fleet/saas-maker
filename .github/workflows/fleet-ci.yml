name: Fleet Contracts CI

on:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Initialize public workflow module
        run: git submodule update --init --depth 1 foundry/ops/workflows
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: foundry/apps/public/public-directory/pnpm-lock.yaml
      - working-directory: foundry/apps/public/public-directory
        run: pnpm install --frozen-lockfile
      - run: pnpm run test:fleet
      - run: pnpm run check:registry
      - run: pnpm run check:public
