name: Public Surface Audit

on:
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run bounded public audit
        id: audit
        continue-on-error: true
        run: node scripts/audit.mjs --mode availability --runs 1
      - name: Commit sanitized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/availability
          if git diff --cached --quiet; then
            echo "No report change"
          else
            git commit -m "evidence: update public surface audit"
            git push
          fi
      - name: Preserve audit result
        if: steps.audit.outcome != 'success'
        run: exit 1
